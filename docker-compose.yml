version: '3.9'

services:
  retro-board:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - retro-data:/app/data   # uploaded images only; boards live in Postgres
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://retro:retro@db:5432/retroboard
      - PGSSL=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=retro
      - POSTGRES_PASSWORD=retro
      - POSTGRES_DB=retroboard
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retroboard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  retro-data:
  pg-data:
